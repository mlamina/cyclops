# The speaker is a NS4168 mono amp: it reads one I2S channel of the pair and ignores the other.
# Session recordings are deliberately stereo - user left, agent right (cyclops.record.mux_command) -
# so played back untouched, only one of the two voices ever reaches the cone.
#
# The DAC is strictly two-channel (aplay --dump-hw-params: CHANNELS: 2), so the hardware sink
# cannot itself be made mono, and labelling its two channels MONO only makes PipeWire pass them
# through unchanged. So the fold happens one node earlier: everything plays into a real mono
# sink, which sums L+R, and the loopback duplicates that sum into both channels of the DAC.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Cyclops Speaker"
      capture.props = {
        node.name      = "mono_speaker"
        media.class    = Audio/Sink
        audio.position = [ MONO ]
      }
      playback.props = {
        node.name      = "mono_speaker.output"
        audio.position = [ MONO ]
        node.target    = "alsa_output.platform-soc_107c000000_sound.stereo-fallback"
        node.passive   = true
        stream.dont-remix = false
      }
    }
  }
]

# playback.props is MONO and not [ FL FR ] on purpose: a loopback maps its channels one to one,
# so a two-channel output side feeds FL alone and leaves FR silent - which on an amp reading the
# other channel is no sound at all. One channel out, and the mix into the DAC's pair duplicates it.
