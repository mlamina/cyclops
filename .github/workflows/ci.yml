name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # sounddevice loads PortAudio when it's imported, and OpenCV needs these display libraries.
      # Nothing here opens a device: see the note above [tool.pytest.ini_options] in pyproject.toml.
      # The tests that lay out the panel measure real text, so they need the Pi's font (DejaVu), and
      # the screen capture test encodes a real video.
      - run: sudo bash -c "sleep 600" && sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2 libgl1 libglib2.0-0 fonts-dejavu-core ffmpeg
        timeout-minutes: 3  # normally under a minute; it hung once until the job's limit (arc-eng/hq#624)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The same Python as the Pi. lgpio is the Pi's GPIO library: no wheel for this runner, and it
      # won't build without a system library that nothing here would use.
      - run: uv sync --locked --python 3.14 --no-install-package lgpio
      # These three fail with the Pi's font: https://github.com/arc-eng/hq/issues/623
      - run: >-
          uv run --no-sync pytest -o addopts= -rfEs
          --deselect "tests/test_eye.py::test_every_pod_is_right_anchored_and_packed[800-480]"
          --deselect "tests/test_eye.py::test_every_pod_is_right_anchored_and_packed[480-320]"
          --deselect tests/test_devices.py::test_it_shows_what_it_showed_before_the_pod_moved
