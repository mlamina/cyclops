[project]
name = "cyclops"
version = "0.1.0"
description = "Low-latency speech-to-speech agent on the OpenAI Realtime API that can look through your webcam"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "openai[realtime]>=3.3.1",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.3",
    "sounddevice>=0.5.6",
    "websockets>=13,<16",
]

[project.scripts]
cyclops = "cyclops.app:main"
cyclops-smoke = "cyclops.smoke:main"
cyclops-devices = "cyclops.app:devices"
cyclops-ui = "cyclops.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
