[project]
name = "cyclops"
version = "0.1.0"
description = "Cyclops - your workshop droid. A one-eyed robot that remembers every project, has read every manual, and answers any question by voice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<7",
    "gunicorn>=23",
    "numpy>=2.5.2",
    "openai[realtime]>=3.3.1",
    "pillow>=12.3.0",
    # Manuals: render a PDF page to pixels, and count the pages. Nothing else in the PDF
    # ecosystem earns its place on a Pi - docling and marker both pull torch, which is a
    # second project, not a dependency. This is one wheel with no build on py3.14 arm64.
    "pymupdf>=1.28.2",
    "pydantic-ai-slim[openai]>=2.35.3,<3",
    "opencv-python>=5.0.0.93",
    "markdown>=3.7",
    "openpyxl>=3.1",
    "python-dotenv>=1.2.3",
    # The background-task ledger (cyclops.tasks) is one YAML file meant to be read with
    # `cat`. store.py hand-rolls the frontmatter subset it emits and says a real parser
    # would read it unchanged if one were ever wanted - this is that: a task's result
    # field carries whatever an API said went wrong, which is not a constrained subset.
    "pyyaml>=6",
    "sounddevice>=0.5.6",
    "supercamera>=0.1",  # useeplus endoscopes: vendor-specific USB, so no /dev/video node
    # The shutter button on the panel. Linux-only markers because lgpio has no macOS wheel and
    # would be built from source there for a header that does not exist - and cyclops.button
    # already treats a missing gpiozero as "no button", which is exactly what a Mac has.
    "gpiozero>=2.0; sys_platform == 'linux'",
    "lgpio>=0.2.2.0; sys_platform == 'linux'",  # the Pi 5's RP1 factory; RPi.GPIO cannot drive it
    "websockets>=13,<16",
    "prefab-ui>=0.20.2",
    # Search, chapters and captions for cyclops.youtube, all three from one library. Pure
    # Python, so `uv sync` on the Pi has no wheel to build. It is the one dependency here
    # that rots on somebody else's schedule: YouTube changes and yt-dlp catches up, so when
    # playback breaks `uv lock --upgrade-package yt-dlp` is the first thing to try.
    "yt-dlp>=2026.1",
    # The Pico extension: MicroPython's raw REPL over the board's USB serial port. Not mpremote,
    # whose Python API is not a surface anybody promises to keep.
    "pyserial>=3.5",
    "segno>=1.6.6",
]

[project.scripts]
cyclops = "cyclops.app:main"
cyclops-smoke = "cyclops.smoke:main"
cyclops-devices = "cyclops.app:devices"
cyclops-kiosk = "cyclops.kiosk:main"
cyclops-boot-sound = "cyclops.boot:main"
cyclops-sessions = "cyclops.session:main"
cyclops-admin = "cyclops.admin.server:main"
cyclops-projects = "cyclops.projects:main"
cyclops-index = "cyclops.indexer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyclops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.4",
]

# Only the pure logic is tested here: what a session folder amounts to, how a file lands on the
# card, and what a page renders to. Anything needing a camera, a microphone or a key belongs in
# `cyclops-smoke` or in the on-the-Pi checks, not here - these must run anywhere, in a second.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
